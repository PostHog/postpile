packages:
  - packages/*
  - apps/*

# pnpm refuses to install while a dependency's build script is neither
# allowed nor denied. esbuild checks its platform binary; electron-winstaller
# is Windows-only.
allowBuilds:
  esbuild: true
  electron-winstaller: false

# Wait 7 days before installing a newly published version, so a
# compromised or broken release has time to be caught and pulled.
minimumReleaseAge: 10080
