# macOS app bundle: pnpm dist (root) builds with electron-vite, then this.
# Everything the app runs is bundled into out/ by electron-vite (main,
# preload, renderer, workspace packages, hono), so the desktop
# package has no runtime dependencies and no node_modules go into the app.
# Local builds are ad-hoc signed (identity "-"): dev machines have no
# Developer ID certificate. An unsigned or half-signed bundle has an invalid
# signature, and macOS drops notifications from such apps without a word.
# The release workflow signs with PostHog's Developer ID instead, with the
# hardened runtime and notarization, by overriding identity, hardenedRuntime
# and notarize on the command line (see .github/workflows/release.yml).
# Changed from com.postpile.app for 0.1.0-alpha.0. macOS keys notification
# permission by the bundle id, so an install that ran the old id asks for it
# again. The data folder (and with it the single-instance lock and the
# welcome marker) is keyed by productName and stays where it is.
appId: com.posthog.postpile
productName: PostPile
# The version comes from this package's package.json (kept in sync with the root).
copyright: Copyright © 2026 PostHog Inc.
electronVersion: 44.4.5
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  # The bundle in out/ already holds everything. With pnpm electron-builder
  # finds no production deps today; this keeps it that way if one is added.
  - "!**/node_modules/**"
  # Hidden source maps from electron-vite: uploaded to PostHog by the release
  # workflow, never shipped inside the app.
  - "!**/*.map"
asar: true
# The UI is English only. Electron ships Chromium's strings for about 220
# locales (an .lproj folder each, about 50 MB unpacked); only en stays. Side
# effect: Chromium's locale is en-US, so the few dates and times formatted
# with the default locale use the US format, like the ones that ask for en-US.
electronLanguages: [en]
# Drops SwiftShader (16 MB) before signing; see the file for why the app
# doesn't need it.
afterPack: ./build/after-pack.mjs
# The MCP launcher (see the file). Lands in Contents/Resources, executable,
# and is signed and notarized with the rest of the bundle.
extraResources:
  - from: build/postpile-mcp
    to: postpile-mcp
mac:
  icon: build/icon.icns
  category: public.app-category.developer-tools
  identity: "-"
  # Hardened runtime and notarization only make sense with a Developer ID;
  # the release workflow turns both on when it has the certificate.
  hardenedRuntime: false
  notarize: false
  # One file for the app and its helpers. Only takes effect under the
  # hardened runtime; see the comment in the file.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dir
      arch: [arm64]
    - target: zip
      arch: [arm64]
  artifactName: PostPile-${version}-mac-${arch}.${ext}
