# Release workflow
#
# Triggers:
#   - Push of a v* tag (e.g. v0.1.0-alpha.0)  -> GitHub release with the zip, the server tarball and their
#                                               sha256 files, then the Homebrew cask and formula
#   - Manual dispatch with an existing v* tag -> the same, from that tag
#
# The manual arm is a fallback: an org tag ruleset can let an admin push a tag
# without firing the push trigger (same reasoning as other PostHog release workflows).
#
# The Homebrew job runs in the `homebrew-tap` environment, which holds the tap
# token secrets and should only admit v* tags, so a branch can't publish the cask.
# It renders homebrew/postpile.rb.tmpl into Casks/postpile.rb and
# homebrew/postpile-server.rb.tmpl into Formula/postpile-server.rb in
# PostHog/homebrew-tap, mirroring PostHog/posthog's build-phrocs.yml.
#
# The build job runs in the `desktop-signing` environment (also v* tags only),
# which holds PostHog's Apple Developer ID certificate and notarization login.
# With them the app is signed, uses the hardened runtime and is notarized, like
# PostHog/posthog's desktop-release.yml. Without the certificate the release
# still goes out ad-hoc signed, with a warning. See RELEASING.md.
#
# Between the bundle build and packaging, posthog-cli injects chunk ids into
# the bundle and uploads its source maps to PostHog Error Tracking, so error
# stacks resolve to the TypeScript source and exceptions carry the release.
# Skipped with a warning when POSTHOG_CLI_API_KEY is not set.

name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            tag:
                description: 'Existing v* tag to release (e.g. v0.1.0-alpha.0). Push the tag first.'
                required: true
                type: string

# One release per tag: a tag push and a dispatch of the same tag must not race
# the same GitHub release and cask commit.
concurrency:
    group: release-${{ inputs.tag || github.ref_name }}
    cancel-in-progress: false

permissions:
    contents: read

jobs:
    build:
        # Apple silicon runner: the app is arm64 only.
        runs-on: macos-14
        # Notarization waits on Apple, usually minutes, sometimes much longer.
        timeout-minutes: 60
        if: github.repository == 'PostHog/postpile'
        environment: desktop-signing
        permissions:
            contents: write
        outputs:
            version: ${{ steps.version.outputs.version }}
            sha256: ${{ steps.checksum.outputs.sha256 }}
            server_sha256: ${{ steps.server.outputs.sha256 }}
            signed: ${{ steps.signing.outputs.signed }}
        env:
            TAG: ${{ inputs.tag || github.ref_name }}
        steps:
            - name: Validate tag
              run: |
                  set -euo pipefail
                  case "$TAG" in
                      v*) ;;
                      *) echo "::error::'${TAG}' is not a v* release tag"; exit 1 ;;
                  esac

            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  # On dispatch, check out the tag itself, not the default branch.
                  ref: ${{ inputs.tag || github.ref }}

            - name: Check the tag matches the app version
              id: version
              run: |
                  set -euo pipefail
                  VERSION="$(node -p "require('./apps/desktop/package.json').version")"
                  if [ "v${VERSION}" != "$TAG" ]; then
                      echo "::error::tag ${TAG} does not match apps/desktop/package.json version ${VERSION}"
                      exit 1
                  fi
                  echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

            # Takes the pnpm version from packageManager in package.json.
            - name: Set up pnpm
              uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

            - name: Set up Node
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck and test
              run: |
                  pnpm typecheck
                  pnpm test

            # No certificate yet (the secrets are not shared with this repo) means an
            # ad-hoc release, so releases keep working until access is granted. A
            # certificate without the notarization login is a setup mistake: fail
            # rather than ship a signed app that Gatekeeper still blocks.
            - name: Check signing secrets
              id: signing
              env:
                  APPLE_CODESIGN_CERT_BASE64: ${{ secrets.APPLE_CODESIGN_CERT_BASE64 }}
                  APPLE_CODESIGN_CERT_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
                  APPLE_ID: ${{ vars.APPLE_ID || secrets.APPLE_ID }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
                  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
              run: |
                  set -euo pipefail
                  if [ -z "$APPLE_CODESIGN_CERT_BASE64" ]; then
                      echo "::warning::APPLE_CODESIGN_CERT_BASE64 is not set in the desktop-signing environment: building an ad-hoc signed, not notarized release. See RELEASING.md > Signing and notarization."
                      echo "signed=false" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  missing=""
                  for name in APPLE_CODESIGN_CERT_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
                      if [ -z "${!name}" ]; then
                          missing="$missing $name"
                      fi
                  done
                  if [ -n "$missing" ]; then
                      echo "::error::APPLE_CODESIGN_CERT_BASE64 is set, but these are missing in the desktop-signing environment:${missing}"
                      exit 1
                  fi
                  echo "signed=true" >> "$GITHUB_OUTPUT"

            # electron-vite build with hidden source maps (.map files, no
            # sourceMappingURL comment; electron-builder.yml leaves them out of the app).
            - name: Build the app bundle
              run: pnpm build

            # The postpile-server formula's tarball: the standalone server and the MCP
            # server bundled into lib/, the web UI in web/, run by Homebrew's node.
            - name: Build the server tarball
              id: server
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  set -euo pipefail
                  pnpm dist:server
                  TARBALL="apps/service/dist/postpile-server-${VERSION}.tar.gz"
                  test -f "$TARBALL"
                  tar -tzf "$TARBALL" | grep -qx 'postpile-server/lib/server.js'
                  tar -tzf "$TARBALL" | grep -qx 'postpile-server/web/index.html'
                  echo "sha256=$(awk '{print $1}' "${TARBALL}.sha256")" >> "$GITHUB_OUTPUT"

            # A personal API key with "error tracking write" and "organization read"
            # (RELEASING.md > Error tracking source maps). Not set means a release
            # with unreadable, release-less error stacks, not a failed release.
            - name: Check PostHog CLI secret
              id: posthog
              env:
                  POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
              run: |
                  set -euo pipefail
                  if [ -z "$POSTHOG_CLI_API_KEY" ]; then
                      echo "::warning::POSTHOG_CLI_API_KEY is not set in the desktop-signing environment: no source maps uploaded, error stacks of this release stay bundled and have no release. See RELEASING.md > Error tracking source maps."
                      echo "upload=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "upload=true" >> "$GITHUB_OUTPUT"
                  fi

            # Before packaging, because the injected files are what must ship:
            # inject prepends a snippet that records each file's chunk id and the
            # release id (the "postpile" release at this version, created on first
            # use), and upload sends the maps keyed by chunk id, then deletes them.
            # main and renderer only: the preload has no error reporting, and the
            # snippet in front of its "use strict" would turn that directive off.
            # A failed upload fails the job, like a half-set signing setup.
            - name: Upload source maps to PostHog
              if: steps.posthog.outputs.upload == 'true'
              env:
                  POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
                  # PostHog's own "PostPile" project (US cloud); not a secret, see packages/engine/src/telemetry/telemetry.ts.
                  POSTHOG_CLI_PROJECT_ID: '635117'
                  POSTHOG_CLI_HOST: https://us.posthog.com
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  set -euo pipefail
                  npm install --global @posthog/cli@0.18.9
                  for dir in apps/desktop/out/main apps/desktop/out/renderer; do
                      posthog-cli sourcemap inject --directory "$dir" --release-name postpile --release-version "$VERSION"
                      posthog-cli sourcemap upload --directory "$dir" --release-name postpile --release-version "$VERSION" --delete-after
                  done
                  grep -q '_posthogChunkIds' apps/desktop/out/main/index.js

            # electron-builder only (the bundle is built above): app + zip, never published by electron-builder itself.
            - name: Package the app (ad-hoc signed)
              if: steps.signing.outputs.signed != 'true'
              run: pnpm --filter @postpile/desktop dist

            # electron-builder.yml stays ad-hoc for local builds, which have no
            # certificate, and this step overrides the three signing keys. That keeps
            # one config file and puts the signing switch next to the secrets.
            # - identity: electron-builder imports CSC_LINK into a temporary keychain
            #   (no keychain steps needed, same as PostHog's desktop release). The
            #   yml's "-" can't be unset from the command line (null means "don't
            #   sign"), so the team ID picks the certificate: it is part of the
            #   certificate name "Developer ID Application: <org> (<team id>)".
            # - forceCodeSigning: fail instead of silently shipping unsigned when
            #   the certificate doesn't match.
            # - notarize: notarytool with APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
            #   APPLE_TEAM_ID from the env, then staples the ticket to the app
            #   before the zip is made.
            - name: Package the app (Developer ID signed and notarized)
              if: steps.signing.outputs.signed == 'true'
              env:
                  CSC_LINK: ${{ secrets.APPLE_CODESIGN_CERT_BASE64 }}
                  CSC_KEY_PASSWORD: ${{ secrets.APPLE_CODESIGN_CERT_PASSWORD }}
                  APPLE_ID: ${{ vars.APPLE_ID || secrets.APPLE_ID }}
                  APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
                  APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
              run: |
                  set -euo pipefail
                  pnpm --filter @postpile/desktop exec electron-builder --mac --config electron-builder.yml --publish never \
                      "-c.mac.identity=${APPLE_TEAM_ID}" \
                      -c.mac.hardenedRuntime=true \
                      -c.mac.notarize=true \
                      -c.forceCodeSigning=true

            # macOS drops notifications from an app with a broken signature, so a bad bundle must not ship.
            - name: Verify the app bundle
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  set -euo pipefail
                  APP=apps/desktop/dist/mac-arm64/PostPile.app
                  codesign --verify --deep --strict "$APP"
                  test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = com.posthog.postpile
                  test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$VERSION"
                  test -f "apps/desktop/dist/PostPile-${VERSION}-mac-arm64.zip"

            # What users get is the zip, so check the app inside it, not only the
            # one in dist/: Developer ID signature with the hardened runtime,
            # Gatekeeper accepts it, and the notarization ticket is stapled (so the
            # first open works offline too).
            - name: Verify signing and notarization
              if: steps.signing.outputs.signed == 'true'
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  set -euo pipefail
                  UNZIPPED="$RUNNER_TEMP/unzipped"
                  rm -rf "$UNZIPPED"
                  ditto -x -k "apps/desktop/dist/PostPile-${VERSION}-mac-arm64.zip" "$UNZIPPED"
                  for APP in apps/desktop/dist/mac-arm64/PostPile.app "$UNZIPPED/PostPile.app"; do
                      echo "--- $APP"
                      codesign --verify --deep --strict --verbose=2 "$APP"
                      codesign -dv --verbose=4 "$APP" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
                      grep -q '^Authority=Developer ID Application:' "$RUNNER_TEMP/codesign.txt"
                      grep -q 'flags=.*runtime' "$RUNNER_TEMP/codesign.txt"
                      spctl --assess --type execute -vv "$APP"
                      xcrun stapler validate "$APP"
                  done

            - name: Checksum
              id: checksum
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  set -euo pipefail
                  cd apps/desktop/dist
                  ZIP="PostPile-${VERSION}-mac-arm64.zip"
                  shasum -a 256 "$ZIP" > "${ZIP}.sha256"
                  cat "${ZIP}.sha256"
                  echo "sha256=$(awk '{print $1}' "${ZIP}.sha256")" >> "$GITHUB_OUTPUT"

            # Notes: the version's section of CHANGELOG.md ("## <version>" up to the next "## ").
            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.version }}
                  GIT_SHA: ${{ github.sha }}
              run: |
                  set -euo pipefail
                  awk -v heading="## ${VERSION}" '
                      index($0, heading) == 1 { found = 1; next }
                      found && /^## / { exit }
                      found { print }
                  ' CHANGELOG.md > /tmp/release-notes.md
                  if [ ! -s /tmp/release-notes.md ]; then
                      echo "Built from commit ${GIT_SHA}." > /tmp/release-notes.md
                  fi
                  # 0.1.0-alpha.0 and friends are pre-releases; 0.1.0 is not.
                  case "$VERSION" in
                      *-*) PRERELEASE=true ;;
                      *) PRERELEASE=false ;;
                  esac
                  ZIP="apps/desktop/dist/PostPile-${VERSION}-mac-arm64.zip"
                  TARBALL="apps/service/dist/postpile-server-${VERSION}.tar.gz"
                  gh release create "$TAG" "$ZIP" "${ZIP}.sha256" "$TARBALL" "${TARBALL}.sha256" \
                      --verify-tag \
                      --title "PostPile ${VERSION}" \
                      --notes-file /tmp/release-notes.md \
                      --prerelease="$PRERELEASE"

    publish-homebrew:
        needs: build
        # ghcommit-action is a Docker action and needs Linux.
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        environment: homebrew-tap
        permissions:
            contents: read
        steps:
            - name: Checkout cask and formula templates
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ inputs.tag || github.ref }}
                  sparse-checkout: |
                      homebrew/postpile.rb.tmpl
                      homebrew/postpile-server.rb.tmpl
                  sparse-checkout-cone-mode: false

            # Render to /tmp before the tap checkout, which replaces the workspace.
            # A signed and notarized build drops the ad-hoc caveat block (xattr /
            # Open Anyway); an ad-hoc build keeps its text and loses only the markers.
            - name: Render Homebrew cask
              env:
                  VERSION: ${{ needs.build.outputs.version }}
                  SHA256: ${{ needs.build.outputs.sha256 }}
                  SIGNED: ${{ needs.build.outputs.signed }}
              run: |
                  set -euo pipefail
                  [ -n "$VERSION" ] && [ -n "$SHA256" ] || { echo "::error::missing version or sha256 from the build job"; exit 1; }
                  if [ "$SIGNED" = true ]; then
                      CAVEAT_EXPR='/ADHOC_CAVEAT_BEGIN/,/ADHOC_CAVEAT_END/d'
                  else
                      CAVEAT_EXPR='/ADHOC_CAVEAT_BEGIN/d;/ADHOC_CAVEAT_END/d'
                  fi
                  sed \
                      -e "s/VERSION_PLACEHOLDER/${VERSION}/g" \
                      -e "s/SHA256_PLACEHOLDER/${SHA256}/g" \
                      -e "$CAVEAT_EXPR" \
                      homebrew/postpile.rb.tmpl > /tmp/postpile.rb
                  if grep -qE 'PLACEHOLDER|ADHOC_CAVEAT' /tmp/postpile.rb; then
                      echo "::error::placeholder or caveat marker left in the rendered cask"
                      exit 1
                  fi
                  cat /tmp/postpile.rb

            - name: Render Homebrew formula
              env:
                  VERSION: ${{ needs.build.outputs.version }}
                  SHA256: ${{ needs.build.outputs.server_sha256 }}
              run: |
                  set -euo pipefail
                  [ -n "$VERSION" ] && [ -n "$SHA256" ] || { echo "::error::missing version or server sha256 from the build job"; exit 1; }
                  sed \
                      -e "s/VERSION_PLACEHOLDER/${VERSION}/g" \
                      -e "s/SHA256_PLACEHOLDER/${SHA256}/g" \
                      homebrew/postpile-server.rb.tmpl > /tmp/postpile-server.rb
                  if grep -q 'PLACEHOLDER' /tmp/postpile-server.rb; then
                      echo "::error::placeholder left in the rendered formula"
                      exit 1
                  fi
                  cat /tmp/postpile-server.rb

            - name: Generate Homebrew tap token
              id: app-token
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_HOMEBREW_TAP_RELEASER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_HOMEBREW_TAP_RELEASER_PRIVATE_KEY }}
                  owner: PostHog
                  repositories: homebrew-tap

            - name: Checkout Homebrew tap
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  repository: PostHog/homebrew-tap
                  token: ${{ steps.app-token.outputs.token }}

            # Staged so ghcommit-action sees the file itself; an untracked new
            # Casks/ folder would show up in git status as the folder only.
            - name: Stage rendered cask and formula
              run: |
                  mkdir -p Casks Formula
                  cp /tmp/postpile.rb Casks/postpile.rb
                  cp /tmp/postpile-server.rb Formula/postpile-server.rb
                  git add Casks/postpile.rb Formula/postpile-server.rb

            - name: Commit Homebrew cask update
              uses: planetscale/ghcommit-action@25309d8005ac7c3bcd61d3fe19b69e0fe47dbdde # v0.2.20
              with:
                  commit_message: 'chore: update postpile cask and postpile-server formula to ${{ needs.build.outputs.version }}'
                  repo: PostHog/homebrew-tap
                  branch: main
              env:
                  GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
